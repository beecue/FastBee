# 项目相关配置
fastbee:
  name: fastbee             # 名称
  version: 2.1.0            # 版本
  copyrightYear: 2024       # 版权年份
  demoEnabled: true         # 实例演示开关
  # 文件路径，以uploadPath结尾 示例（ Windows配置 D:/uploadPath，Linux配置 /uploadPath）
  profile: D:/uploadPath
  addressEnabled: true      # 获取ip地址开关
  captchaType: math         # 验证码类型 math 数组计算 char 字符验证
  mqtt:
    server-username: ${FASTBEE_MQTT_SERVER_USERNAME:fastbee-server}
    # 单机内置 Broker 未配置密码时，在进程启动时生成。
    server-password: ${FASTBEE_MQTT_SERVER_PASSWORD:}
    # 仅接入外置 Broker HTTP 认证时配置独立密钥。
    callback-token: ${FASTBEE_MQTT_CALLBACK_TOKEN:}
    # 仅当外置 EMQX 向 /iot/tool/mqtt/webhook 或 /iot/tool/mqtt/webhookv5 发送设备事件时配置。
    # 为 FastBee 进程设置环境变量 FASTBEE_MQTT_WEBHOOK_TOKEN，使用至少 32 字符的随机密钥，
    # 且与 server-password、callback-token 不同。EMQX 的事件回调请求头 X-FastBee-Webhook-Token 填同一个值。
    # 仅使用内置 Broker 时可留空。留空时 HTTP 事件回调返回 401，内置 Broker 仍通过 MQTT 会话更新设备状态。
    webhook-token: ${FASTBEE_MQTT_WEBHOOK_TOKEN:}
    # 规则脚本或集成使用的额外精确 Topic，多个以逗号分隔。
    server-extra-publish-topics: ${FASTBEE_MQTT_SERVER_EXTRA_PUBLISH_TOPICS:}
    server-extra-subscribe-topics: ${FASTBEE_MQTT_SERVER_EXTRA_SUBSCRIBE_TOPICS:}
    device-auth:
      max-failures: ${FASTBEE_MQTT_DEVICE_MAX_FAILURES:10}
      source-product-max-failures: ${FASTBEE_MQTT_SOURCE_PRODUCT_MAX_FAILURES:100}
      window-seconds: ${FASTBEE_MQTT_DEVICE_AUTH_WINDOW_SECONDS:60}

# 开发环境配置
server:
  port: 8080                # 服务器的HTTP端口，默认为8080
  servlet:
    context-path: /         # 应用的访问路径
  tomcat:
    uri-encoding: UTF-8     # tomcat的URI编码
    accept-count: 1000      # 连接数满后的排队数，默认为100
    threads:
      max: 800              # tomcat最大线程数，默认为200
      min-spare: 100        # Tomcat启动初始化的线程数，默认值10
  # 基于netty的服务器
  broker:
    broker-node: node1
    port: 1883
    websocket-port: 8083
    websocket-path: /mqtt
    keep-alive: 70           # 默认的全部客户端心跳上传时间

# Spring配置
spring:
  # 环境配置，dev=开发环境，prod=生产环境
  profiles:
    active: dev              # 环境配置，dev=开发环境，prod=生产环境
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      max-file-size:  10MB                             # 单个文件大小
      max-request-size:  20MB                          # 设置总上传的文件大小
  # 服务模块
  devtools:
    restart:
      enabled: true                                    # 热部署开关
  task:
    execution:
      pool:
        core-size: 20                                  # 最小连接数
        max-size: 200                                  # 最大连接数
        queue-capacity: 3000                           # 最大容量
        keep-alive: 60
  datasource:
    druid:
      webStatFilter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        loginUsername: fastbee
        loginPassword: fastbee
    dynamic:
      primary: master
      strict: false
      lazy: true

# 用户配置
user:
  password:
    maxRetryCount: 5                                    # 密码最大错误次数
    lockTime: 10                                        # 密码锁定时间（默认10分钟）

# token配置
token:
  header: Authorization                                 # 令牌自定义标识
  secret: ${TOKEN_SECRET:abcdefghijklfastbeesmartrstuvwxyz}             # 令牌密钥（生产请通过环境变量 TOKEN_SECRET 注入唯一高强度值）
  expireTime: 1440                                      # 令牌有效期（默认30分钟）1440为一天

# mybatis-plus配置
mybatis-plus:
  typeAliasesPackage: com.fastbee.**.domain             # 搜索指定包别名
  mapperLocations: classpath*:mapper/**/*Mapper.xml     # 配置mapper的扫描，找到所有的mapper.xml映射文件
  configLocation: classpath:mybatis/mybatis-config.xml  # 加载全局的配置文件
  global-config:
    db-config:
      id-type: AUTO # 自增 ID
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 防止XSS攻击
xss:
  enabled: true                                         # 过滤开关
  excludes: /system/notice                              # 排除链接（多个用逗号分隔）
  urlPatterns: /system/*,/monitor/*,/tool/*             # 匹配链接

# 规则脚本统一使用受限编译器和业务能力白名单，禁止关闭安全边界。
script:
  sandbox:
    enabled: true
    allow-network: true # 保留既有 HTTP 集成；设为 false 禁止脚本主动 HTTP 调用
